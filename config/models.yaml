# AI Model Configuration per Platform
#
# This file controls which OpenAI model to use for each platform
# and content type (text vs video).
#
# Available models:
#   - gpt-6-luna: Fast, cost-effective, great for most content
#   - gpt-5.6-sol: More powerful, better for complex/longer content
#
# You can adjust temperature (creativity) and max_tokens (length) per platform.
# max_tokens is sent to OpenAI as max_completion_tokens.
#
# gpt-4o-mini and gpt-4.1 are removed from the API on 2027-01-14; OpenAI names
# gpt-6-luna as the replacement for both. GPT-6 Luna only accepts a custom
# temperature with reasoning_effort "none", so its entries set that.
#
# gpt-5 shuts down on 2026-12-11; OpenAI names gpt-5.6-sol as its replacement
# (https://developers.openai.com/api/docs/deprecations). Keep temperature at
# 1.0 (the default) for GPT-5.x entries; reasoning models reject other values.

# Default settings used when platform doesn't have specific config
defaults:
  model: "gpt-6-luna"
  reasoning_effort: "none"
  temperature: 0.1
  max_tokens: 5000

# Platform-specific configurations
# Use 'text' and 'video' keys for platforms with different prompts
platforms:

  # LinkedIn: Professional content
  linkedin:
    text:
      model: "gpt-5.6-sol"
      temperature: 1.0
      description: "LinkedIn text-only posts"
    video:
      model: "gpt-5.6-sol"  # Use better model for video-based content
      temperature: 1.0
      description: "LinkedIn posts with video transcripts"

  # Instagram: Visual storytelling
  instagram:
    model: "gpt-6-luna"
    reasoning_effort: "none"
    temperature: 0.8  # Slightly more creative
    max_tokens: 2200  # Instagram allows longer captions
    description: "Instagram posts and reels"

  # TikTok: Viral, energetic content
  tiktok:
    model: "gpt-6-luna"
    reasoning_effort: "none"
    temperature: 0.9  # More creative for viral content
    max_tokens: 2200
    description: "TikTok video captions"

  # YouTube Shorts: Concise, punchy
  youtube:
    model: "gpt-6-luna"
    reasoning_effort: "none"
    temperature: 0.8
    max_tokens: 1000
    description: "YouTube Shorts captions"

  youtube_shorts:
    model: "gpt-6-luna"
    reasoning_effort: "none"
    temperature: 0.8
    max_tokens: 1000
    description: "YouTube Shorts captions (alias)"

  # Facebook: Community-focused
  facebook:
    model: "gpt-6-luna"
    reasoning_effort: "none"
    temperature: 0.7
    max_tokens: 1500
    description: "Facebook posts"

  # Twitter/X: Concise, witty
  twitter:
    model: "gpt-6-luna"
    reasoning_effort: "none"
    temperature: 0.8
    max_tokens: 280  # Twitter character limit
    description: "Twitter/X posts"

  # Threads: Conversational
  threads:
    model: "gpt-6-luna"
    reasoning_effort: "none"
    temperature: 0.8
    max_tokens: 500
    description: "Threads posts"

  # Bluesky: Twitter-like
  bluesky:
    model: "gpt-6-luna"
    reasoning_effort: "none"
    temperature: 0.8
    max_tokens: 300
    description: "Bluesky posts"

  # Pinterest: Inspirational
  pinterest:
    model: "gpt-6-luna"
    reasoning_effort: "none"
    temperature: 0.8
    max_tokens: 500
    description: "Pinterest pin descriptions"

  # Skool: Community engagement posts
  skool:
    model: "gpt-5.6-sol"
    temperature: 1.0
    description: "Skool community posts with day-specific templates"
